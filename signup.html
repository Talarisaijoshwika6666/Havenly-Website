<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Havenly</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="index.html" class="brand" aria-label="Havenly home">HAVENLY</a>

        <nav aria-label="Main navigation">
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="styles.html">Styles</a></li>
            <li><a href="products.html">Shop</a></li>
            <li><a href="index.html#design-your-room">Design Your Room</a></li>
            <li><a href="designer.html">Designers</a></li>
          </ul>
        </nav>

        <div class="nav-actions">
          <a href="#" class="nav-icon" aria-label="Search">⌕</a>
          <a href="wishlist.html" class="nav-icon" aria-label="Wishlist">♡</a>
          <a href="cart.html" class="nav-icon" aria-label="Cart">🛒</a>
          <a href="profile.html" class="nav-icon" aria-label="Profile">◉</a>
        </div>
      </div>
    </header>

    <main>
      <section class="auth-layout">
        <div class="auth-visual">
          <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1200&q=80" alt="Stylish living room in a modern home" />
          <div class="auth-overlay">
            <div class="auth-overlay-content">
              <h2>Begin your better space.</h2>
              <p>“Your home should feel like a reflection of the life you love.”</p>
            </div>
          </div>
        </div>

        <div class="auth-panel">
          <div class="auth-box">
            <div class="auth-header">
              <div class="brand">HAVENLY</div>
              <h1>Create Account</h1>
            </div>

            <form aria-label="Sign up form">
              <fieldset class="form-grid">
                <legend class="sr-only">Create account</legend>

                <div class="field">
                  <label for="signup-name">Full Name</label>
                  <input id="signup-name" type="text" name="name" />
                </div>

                <div class="field">
                  <label for="signup-email">Email</label>
                  <input id="signup-email" type="email" name="email" />
                </div>

                <div class="field">
                  <label for="signup-password">Password</label>
                  <input id="signup-password" type="password" name="password" />
                </div>

                <div class="field">
                  <label for="signup-confirm">Confirm Password</label>
                  <input id="signup-confirm" type="password" name="confirm-password" />
                </div>

                <label class="checkbox-row">
                  <input type="checkbox" name="terms" />
                  <span>I agree to Terms &amp; Privacy Policy</span>
                </label>

                <button type="submit" class="btn btn-primary">Create Account</button>
              </fieldset>
            </form>

            <div class="auth-footer">
              <p>Already have an account? <a href="login.html">Sign In</a></p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
